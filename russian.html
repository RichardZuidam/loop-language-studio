<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LOOP Russisch">
  <link rel="manifest" href="manifest-richard.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>LOOP Russisch installeren</title>
  <script>
    (()=>{const launch=new URLSearchParams(location.search).get('launch')==='1',standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;if(launch||standalone)location.replace('./?course=richard&lang=nl');})();
  </script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171714;color:#f1efe7;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);border:1px solid #777;padding:34px;box-shadow:9px 9px 0 #ceff1a}.eyebrow{font:700 11px monospace;letter-spacing:.12em;color:#ceff1a}.logo{font-size:62px;font-weight:900;letter-spacing:-.08em;margin:22px 0 8px}.logo span{display:block;color:#ceff1a}.steps{line-height:1.65;font-size:18px;padding-left:24px}.button{display:block;margin-top:28px;padding:17px;border:1px solid #ceff1a;color:#171714;background:#ceff1a;text-decoration:none;text-align:center;font:700 12px monospace;text-transform:uppercase}.note{color:#aaa;font-size:13px;line-height:1.5}
  </style>
</head>
<body><main class="card"><p class="eyebrow">APARTE IPHONE-APP</p><div class="logo">LOOP <span>RUSSISCH.</span></div><ol class="steps"><li>Tik in Safari op <b>Delen</b>.</li><li>Kies <b>Zet op beginscherm</b>.</li><li>Open daarna het nieuwe icoon.</li></ol><p class="note">Dit vaste installatieadres voorkomt dat het icoon naar de Vietnamese cursus gaat.</p><a class="button" href="./?course=richard&amp;lang=nl">Cursus nu openen →</a></main></body>
</html>
